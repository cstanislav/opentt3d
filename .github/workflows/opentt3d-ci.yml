name: OpenTT3D - Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentt3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86-64 / Mesa
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check integration boundary and authored assets
        run: |
          python3 tools/opentt3d/check_boundary.py
          python3 -m unittest discover -s tools/assets -p 'test_*.py'
          python3 -m unittest discover -s tools/opentt3d -p 'test_*.py'
      - name: Build container
        run: docker build -t opentt3d-dev -f docker/Dockerfile .
      - name: Build game and run tests
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace opentt3d-dev python3 tools/opentt3d/build.py --build-dir build-linux --jobs 4
      - name: Render with Mesa in a virtual display
        run: docker run --init --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace opentt3d-dev xvfb-run -a python3 tools/opentt3d/smoke.py --build-dir build-linux --output build-linux/smoke-ci --savegame media/baseset/opntitle.dat --graphics-from-config "OpenGFX2 High Def" --rotation 1 --verify-renderer --verify-tile-picking --verify-bridges --reference-bridge --timeout 3600 --memory-limit-mib 6144 --brief
      - name: Validate Vulkan presentation and synchronization
        run: docker run --init --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace opentt3d-dev xvfb-run -a python3 tools/opentt3d/smoke.py --build-dir build-linux --output build-linux/vulkan-ci --backend vulkan --vulkan-validation --savegame media/baseset/opntitle.dat --blitter 40bpp-anim --verify-renderer --verify-tile-picking --verify-vehicles --verify-industries --verify-bridges --verify-fences --verify-foundations --verify-tunnels --verify-live-tunnel --verify-rails --verify-stations --verify-ground-details --verify-rail-details --first-person tunnel --benchmark-frames 30 --timeout 3600 --memory-limit-mib 6144 --brief
      - name: Build and render a real electric-rail journey
        run: |
          docker run --init --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace opentt3d-dev python3 tools/opentt3d/fixture_rail.py --build-dir build-linux --output build-linux/electric-fixture-ci
          docker run --init --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace opentt3d-dev xvfb-run -a python3 tools/opentt3d/smoke.py --build-dir build-linux --output build-linux/electric-ci --backend vulkan --vulkan-validation --savegame build-linux/electric-fixture-ci/save/rail-fixture.sav --ai-dir build-linux/electric-fixture-ci/ai --reference-catenary --verify-live-tunnel --verify-rail-details --verify-stations --verify-depots --verify-crossings --verify-road-stops --verify-trees --first-person auto --running --benchmark-frames 120 --timeout 240
      - name: Store verification artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-verification
          path: |
            build-linux/Testing/Temporary/
            build-linux/smoke-ci/
            build-linux/vulkan-ci/
            build-linux/electric-fixture-ci/
            build-linux/electric-ci/

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install runner-only build dependencies
        run: brew install libpng lzo opusfile
      - name: Fetch pinned build-local MoltenVK
        run: python3 tools/opentt3d/fetch_vulkan.py build-macos/vulkan
      - name: Build game and run tests
        run: python3 tools/opentt3d/build.py --build-dir build-macos --jobs 3
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-verification
          path: build-macos/Testing/Temporary/

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host: x64
          - arch: x86
            host: x86
          - arch: arm64
            host: x64_arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: OpenTTD/actions/setup-vcpkg@v6
        id: vcpkg
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native code-generation tools
        shell: bash
        run: |
          cmake -S . -B build-host -GNinja -DOPTION_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-host --target tools --parallel 4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.host }}
      - name: Build game
        shell: bash
        run: |
          cmake -S . -B build-windows -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows-static \
            -DHOST_BINARY_DIR="$GITHUB_WORKSPACE/build-host"
          cmake --build build-windows --target openttd --parallel 4
      - name: Run native tests
        if: matrix.arch != 'arm64'
        shell: bash
        run: |
          cmake --build build-windows --target openttd_test regression_files --parallel 4
          python tools/opentt3d/fetch_baseset.py build-windows/baseset
          ctest --test-dir build-windows --output-on-failure
      - name: Store build and test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}-verification
          path: |
            build-windows/Testing/Temporary/
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
