name: CI - Nightly

on:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          full_arch: x86_64

    name: Mac OS (${{ matrix.arch }})

    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

    with:
      arch: ${{ matrix.arch }}
      full_arch: ${{ matrix.full_arch }}

  mingw:
    strategy:
      fail-fast: false
      matrix:
        include:
        # MSYS2 has retired the 32-bit MINGW32 repositories and no longer
        # provides lzo2/lld for i686. The Windows x86 release target is still
        # built natively with MSVC; keep this nightly job on the supported
        # MINGW64 environment rather than failing package setup every night.
        - msystem: MINGW64
          arch: x86_64

    name: MinGW (${{ matrix.arch }})

    uses: ./.github/workflows/ci-mingw.yml
    secrets: inherit

    with:
      msystem: ${{ matrix.msystem }}
      arch: ${{ matrix.arch }}

  check_annotations:
    name: Check Annotations
    needs:
    - macos
    - mingw

    if: always()

    runs-on: ubuntu-latest

    steps:
    - name: Check annotations
      uses: OpenTTD/actions/annotation-check@v6
