name: OpenTT3D - Check upstream stable

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check for an upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/opentt3d/upstream.py check
